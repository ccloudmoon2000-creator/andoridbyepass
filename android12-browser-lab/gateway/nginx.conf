server {
    listen 8080;
    server_name _;
    server_tokens off;
    client_max_body_size 16k;

    auth_basic "AOSP Android 12 Remote Lab";
    auth_basic_user_file /etc/nginx/.htpasswd;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    root /usr/share/nginx/html;
    index index.html;

    location /api/ {
        proxy_pass http://android:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 20s;
    }

    # Serve the genuine noVNC client against the actual VNC stream from the emulator's X display.
    location = /vnc.html {
        proxy_pass http://android:6080/vnc.html;
        proxy_set_header Host $host;
    }
    location ~ ^/(app|core|vendor|images)/ {
        proxy_pass http://android:6080;
        proxy_set_header Host $host;
    }
    location = /websockify {
        proxy_pass http://android:6080/websockify;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 1h;
        proxy_send_timeout 1h;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
